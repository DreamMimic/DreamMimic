# G1 No-reference student with visual information and World Model env config
env:
  numEnvs: 1024 # Aligned with SMPLX
  envSpacing: 5  # Aligned with SMPLX
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Hybrid" #Random
  rolloutLength: 300
  hybridInitProb: 0.5
  dataFPS: 30
  dataFramesScale: 1 # 25->30fps
  ballSize: 1.
  numObsRetarget: 2152  # G1 retarget obs: 2 * obs_iter (without progress flag)
  numObs: 8135 # No-ref student observation dimension (current obs 1983 + visual 6144)
  numDoF: 43  # G1 DOF
  numDoFWrist: 3  # G1 wrist DOF
  numDoFHand: 7  # G1 hand DOF
  removePrivilegedObs: True # If True, drop object state, IG, target_contact from student obs
  # Visual obs calculation: 32*32*channels*3 = visual_size
  #   - depth_seg (default): 32*32*2*3 = 6144
  #   - rgb: 32*32*3*3 = 9216
  #   - depth/segmentation: 32*32*1*3 = 3072
  teacherObsSize: 2153 # Teacher uses full observations with reference
  motion_file: InterAct/OMOMO_new
  robotType: 'g1/g1_29dof_with_hand.urdf'
  objectDensity: 200  # Aligned with SMPLX
  dataSub: ['sub8'] # Example, can be configured
  localRootObs: False
  keyBodies: ['left_hip_yaw_link', 'left_knee_link', 'left_ankle_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_roll_link', 'torso_link', 'mid360_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_yaw_link', 'left_hand_index_tip_link', 'left_hand_middle_tip_link', 'left_hand_thumb_tip_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_yaw_link', 'right_hand_index_tip_link', 'right_hand_middle_tip_link', 'right_hand_thumb_tip_link']
  keyIndex: [ 1,  2,  3,  5,  6,  7,  9, 13, 15,  16,  17, 20, 23, 32, 34, 35, 36, 39, 42, 51]
  contactBodies: ['left_hip_yaw_link', 'left_knee_link', 'left_ankle_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_roll_link', 'torso_link', 'mid360_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_yaw_link', 'left_hand_index_1_link', 'left_hand_middle_1_link', 'left_hand_thumb_2_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_yaw_link', 'right_hand_index_1_link', 'right_hand_middle_1_link', 'right_hand_thumb_2_link']
  contactIndex: [ 1,  2,  3,  5,  6,  7,  9, 13, 15,  16,  17, 20, 23, 32, 34, 35, 36, 39, 42, 51]
  terminationHeight: 0.15
  enableEarlyTermination: True
  scaling: 0.75
  initRootHeight: 0.94
  teacherPolicy: checkpoints/g1/sub8.pth
  teacherPolicyCFG: dreammimic/data/cfg/train/rlg/omomo_g1_29dof_with_hand.yaml
  asset:
    assetRoot: "dreammimic/data/assets"
  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.7
  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.
    op: 5.0
    or: 0.1
    opv: 0.1
    orv: 0.
    ig: 5.
    cg1: 3.
    cg2: 3.
    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

# Camera sensor configuration - G1 camera on d435_link
sensor:
  enableCamera: True
  visual_input_type: 'depth_seg'  # Options: 'rgb', 'depth', 'segmentation', 'depth_seg' (default)
  onboard_camera:
    position: [0.1, 0.0, 0.0]  # Position relative to d435_link
    rotation: [0.0, 0.0, 0.0]  # Roll, pitch, yaw
    resolution: [80, 60]       # Width, height
    horizontal_fov: 110         # 110 degrees
    attach_link: 'd435_link'    # G1 specific: attach to d435_link instead of head
  resized_resolution: [32, 32] # Resized for network input

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 1048576
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
